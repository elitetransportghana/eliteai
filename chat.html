    function searchTimeGroup(ts){
      if(!ts) return 'Older';
      const diff=Date.now()-ts;
      const days=Math.floor(diff/86400000);
      if(days<1) return 'Today';
      if(days<2) return 'Yesterday';
      if(days<7) return 'Past week';
      if(days<30) return 'Past month';
      if(days<365) return 'Past year';
      return 'Older';
    }

    function renderSearchResults(){
      const list=document.getElementById('search-list');
      const inp=document.getElementById('search-input');
      if(!list) return;
      const q=(inp?.value||'').toLowerCase().trim();
      const chatIcon='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

      let matches;
      if(!q){
        matches=conversations.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      } else {
        matches=conversations.filter(conv=>{
          const title=(conv.title||'').toLowerCase();
          const msgs=(conv.messages||[]).some(m=>(m.content||'').toLowerCase().includes(q));
          return title.includes(q)||msgs;
        }).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      }

      if(!matches.length){
        list.innerHTML=`<div class="search-modal-empty">${q?'No results for &ldquo;'+escHtml(q)+'&rdquo;':'No conversations yet'}</div>`;
        return;
      }

      list.innerHTML='';
      let lastGroup=null;
      matches.forEach((conv,i)=>{
        const group=searchTimeGroup(conv.updatedAt);
        if(group!==lastGroup){
          const lbl=document.createElement('div');
          lbl.className='search-modal-group';
          lbl.textContent=group;
          list.appendChild(lbl);
          lastGroup=group;
        }
        const item=document.createElement('div');
        item.className='search-modal-item'+(i===0?' focused':'');
        const iconBox=`<div class="search-modal-item-icon">${chatIcon}</div>`;
        const timeLabel=escHtml(group);
        item.innerHTML=`${iconBox}<span class="search-modal-item-title">${escHtml(conv.title||'New chat')}</span>${i===0?'<span class="search-modal-item-enter">Enter</span>':'<span class="search-modal-item-time">'+timeLabel+'</span>'}`;
        item.addEventListener('click',()=>{ closeSearchPanel(); loadConv(conv.id); });
        item.addEventListener('mouseenter',()=>{
          document.querySelectorAll('#search-list .search-modal-item').forEach(it=>it.classList.remove('focused'));
          item.classList.add('focused');
          // Swap enter badge
          document.querySelectorAll('#search-list .search-modal-item').forEach((it,idx)=>{
            const timeEl=it.querySelector('.search-modal-item-time,.search-modal-item-enter');
            if(!timeEl) return;
            const g=searchTimeGroup(matches[idx]?.updatedAt);
            if(it===item){
              timeEl.className='search-modal-item-enter';
              timeEl.textContent='Enter';
            } else {
              timeEl.className='search-modal-item-time';
              timeEl.textContent=g;
            }
          });
        });
        list.appendChild(item);
      });
    }

    function relativeTime(ts){
      if(!ts) return '';
      const diff=Date.now()-ts;
      const mins=Math.floor(diff/60000);
      const hrs=Math.floor(diff/3600000);
      const days=Math.floor(diff/86400000);
      if(mins<1) return 'just now';
      if(mins<60) return mins===1?'1 minute ago':mins+' minutes ago';
      if(hrs<24) return hrs===1?'1 hour ago':hrs+' hours ago';
      if(days===1) return 'yesterday';
      if(days<7) return days+' days ago';
      if(days<14) return 'last week';
      if(days<30) return Math.floor(days/7)+' weeks ago';
      if(days<365) return Math.floor(days/30)+' months ago';
      return Math.floor(days/365)+' years ago';
    }

    async function copyTextToClipboard(value){
      const text=String(value||'');
      if(!text) return false;
      if(navigator.clipboard?.writeText){
        try{
          await navigator.clipboard.writeText(text);
          return true;
        }catch{}
      }
      const temp=document.createElement('textarea');
      temp.value=text;
      temp.setAttribute('readonly','');
      temp.style.position='fixed';
      temp.style.left='-9999px';
      temp.style.top='0';
      document.body.appendChild(temp);
      temp.select();
      let success=false;
      try{ success=document.execCommand('copy'); }catch{}
      temp.remove();
      return success;
    }

    async function copyMessage(event){
      const button=event?.currentTarget||event?.target?.closest('.msg-action-btn');
      const messageNode=button?.closest('.message');
      const text=messageNode?.querySelector('.message-content')?.innerText||'';
      if(!text) return;
      const copied=await copyTextToClipboard(text);
      if(!copied) return;
      setCopyButtonState(button,true);
      clearTimeout(button._copyResetTimer);
      button._copyResetTimer=setTimeout(()=>setCopyButtonState(button,false),1400);
    }

    async function sendMessage(overrideText){
      const text=overrideText||(msgInputEl.value||'').trim();
      if(!text) return;
      if(!userProfile) {window.location.href='landing.html';return;}
      const stableUserId=localStorage.getItem('elite_user_id_v1')||userProfile.email||userProfile.name;
      msgInputEl.value='';
      autoResize();
      updateSendVisibility();
      const conv=getOrCreateConv(text);
      emptyStateEl.style.display='none';
      messagesEl.style.display='';
      setComposerMode(false);
      renderMessage('user',text);
      renderTyping();
      try{
        const payload={
          input:text,
          session_id:conv.sessionId,
          user_id:stableUserId,
          skip_onboarding:true,
          user_name:userProfile.name,
          user_age:userProfile.age,
          user_course:userProfile.course,
          user_level:userProfile.level,
          selected_model:DEFAULT_MODEL,
          attachments:attachedFiles
        };
        const resp=await fetch(API_URL,{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Accept':'application/json',
            ...(_sbToken ? {'Authorization':'Bearer '+_sbToken} : {})
          },
          body:JSON.stringify(payload),
          credentials:'omit'
        });
        const data=await resp.json();
        removeTyping();
        const rawOutput=String(data.output||'').trim();

        // If tool_action is missing, try to detect artifact info from output text
        let effectiveToolAction=String(data.tool_action||'').trim();
        let effectivePreviewPath=String(data.preview_path||'').trim();
        let effectiveArtifactId=String(data.artifact_id||'').trim();
        if(!effectiveToolAction && rawOutput){
          const openHereMatch=rawOutput.match(/Open here:\s*(\/api\/platform\/artifacts\/[^\s\n]+)/i);
          if(openHereMatch){
            effectivePreviewPath=effectivePreviewPath||openHereMatch[1].trim();
            // Guess artifact type from output text
            if(/questionnaire|form|survey/i.test(rawOutput)) effectiveToolAction='questionnaire.create';
            else if(/logbook/i.test(rawOutput)) effectiveToolAction='logbook.create';
            else effectiveToolAction='document.create';
          }
          // Also pick up artifact_id from path if missing
          if(!effectiveArtifactId && effectivePreviewPath){
            const idMatch=effectivePreviewPath.match(/artifacts\/(artifact_[^\/\?]+)/);
            if(idMatch) effectiveArtifactId=idMatch[1];
          }
        }

        const hasArtifact=Boolean(effectiveToolAction && (effectivePreviewPath||effectiveArtifactId));

        // Strip verbose metadata lines from output when an artifact is being opened
        let replyText=rawOutput||localFallbackReply(text);
        if(hasArtifact){
          // Keep only the first meaningful sentence/line before raw API paths begin
          const lines=rawOutput.split('\n');
          const cleanLines=lines.filter(l=>{
            const t=l.trim();
            return t && !t.startsWith('/api/') && !/^(Draft:|Response project:|Open here:|Share:|Responses:|Analytics:|Export:)/i.test(t);
          });
          replyText=cleanLines.join('\n').trim()||'Your artifact is ready.';
        }

        conv.messages.push({role:'user',content:text});
        conv.messages.push({role:'assistant',content:replyText});
        conv.updatedAt=Date.now();
        saveConvs();
        renderMessage('assistant',replyText);
        renderSidebar();
        if(effectiveToolAction){
          const _uid=stableUserId;
          const previewUrl=effectivePreviewPath
            ? buildAuthorizedAppUrl(effectivePreviewPath,{format:'html',user_id:_uid})
            : null;
          const artifactTitle=effectiveToolAction.startsWith('questionnaire.')
            ? 'Questionnaire'
            : effectiveToolAction.startsWith('logbook.')
              ? 'Logbook'
              : 'Document';
          const enrichedData=Object.assign({},data,{
            tool_action:effectiveToolAction,
            preview_path:effectivePreviewPath,
            artifact_id:effectiveArtifactId
          });
          setTimeout(()=>openArtifactWithContent(artifactTitle, previewUrl, enrichedData), 300);
        }
      }catch(e){
        removeTyping();
        console.error('API Error:',e);
        console.error('Error details:', {
          message: e.message,
          stack: e.stack,
          name: e.name
        });
        let errorMsg=localFallbackReply(text);
        if(e instanceof TypeError && e.message.includes('fetch')){
          errorMsg='Connection error. Please check if the API is available and try again.';
        }
        renderMessage('assistant',errorMsg);
      }
    }

    // ── Auth helpers (no SDK — tokens stored locally) ─────────────────────────
    const API_BASE_AUTH = 'https://uds-ttfpp-whatsapp-bot.elitetransportghana.workers.dev';
    let _sbToken = '';

    function _loadStoredAuth() {
      try {
        const raw = sessionStorage.getItem('elite_sb_token_v1') || localStorage.getItem('elite_sb_token_v1');
        if (!raw) return null;
        return JSON.parse(raw); // { access_token, refresh_token, expires_at, user_id }
      } catch (_) { return null; }
    }

    function _isTokenValid(stored) {
      if (!stored || !stored.access_token) return false;
      try {
        const parts = stored.access_token.split('.');
        if (parts.length !== 3) return false;
        const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
        // Consider expired 60s before actual expiry to avoid edge cases
        return payload.exp && Math.floor(Date.now() / 1000) < (payload.exp - 60);
      } catch (_) { return false; }
    }

    async function _refreshToken(refreshToken) {
      try {
        const resp = await fetch(`${API_BASE_AUTH}/api/auth/refresh`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refreshToken })
        });
        const data = await resp.json();
        if (!data.ok || !data.access_token) return null;
        return data;
      } catch (_) { return null; }
    }

    function _saveTokens(data) {
      const payload = JSON.stringify({
        access_token:  data.access_token  || '',
        refresh_token: data.refresh_token || '',
        expires_at:    data.expires_at    || 0,
        user_id:       (data.user && data.user.id) || data.user_id || ''
      });
      sessionStorage.setItem('elite_sb_token_v1', payload);
      localStorage.setItem('elite_sb_token_v1',   payload);
    }

    (async function boot(){
      // ── Auth gate: check stored token, refresh if expired ─────────────────
      let stored = _loadStoredAuth();

      if (stored && !_isTokenValid(stored) && stored.refresh_token) {
        // Access token expired but we have a refresh token → silently refresh
        const refreshed = await _refreshToken(stored.refresh_token);
        if (refreshed) {
          _saveTokens(refreshed);
          stored = _loadStoredAuth();
        } else {
          stored = null; // Refresh also failed → force re-login
        }
      }

      if (!stored || !_isTokenValid(stored)) {
        window.location.href = 'landing.html'; return;
      }

      _sbToken = stored.access_token;
      localStorage.setItem('elite_user_id_v1', stored.user_id || '');

      loadConvs();
      loadProfile();
      // If profile missing (e.g. cleared localStorage), can't rebuild without Supabase metadata → go back to landing
      if (!userProfile) {
        // Clear tokens so landing.html's session check won't loop-redirect back here
        localStorage.removeItem('elite_sb_token_v1');
        sessionStorage.removeItem('elite_sb_token_v1');
        window.location.href = 'landing.html'; return;
      }
      applyTheme(currentTheme);
      applyDynamicHeroWords();
      updateSendVisibility();
      initSuggestions();
      renderSidebar();
      renderSidebarProfile();
      setComposerMode(true);
      const darkQuery=window.matchMedia('(prefers-color-scheme: dark)');
      const onSystemThemeChange=()=>{ if(currentTheme==='system') applyTheme('system'); };
      if(typeof darkQuery.addEventListener==='function') darkQuery.addEventListener('change',onSystemThemeChange);
      else if(typeof darkQuery.addListener==='function') darkQuery.addListener(onSystemThemeChange);

      document.addEventListener('click',event=>{
        const menu=document.getElementById('theme-menu');
        const button=document.getElementById('theme-btn');
        if(!menu || menu.hidden) return;
        if(button && button.contains(event.target)) return;
        if(menu.contains(event.target)) return;
        closeThemeMenu();
      });
      document.addEventListener('keydown',event=>{
        if(event.key==='Escape') closeThemeMenu();
      });

      setInterval(()=>{
        applyDynamicHeroWords();
        initSuggestions();
      },60000);
    })();
  </script>
</body>
</html>
